name: Build iOS unsigned IPA

on:
  push:
    branches:
      - main
      - ios18-backport
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios18-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    name: Build MeloX-iOS-unsigned.ipa
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Select Xcode
        shell: bash
        run: |
          set -euo pipefail

          XCODE_APP="$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1 || true)"
          if [[ -z "${XCODE_APP}" ]]; then
            echo "::error::No Xcode installation found"
            exit 1
          fi
          sudo xcode-select -s "${XCODE_APP}/Contents/Developer"
          xcodebuild -version

          SDK_VERSION="$(xcrun --sdk iphoneos --show-sdk-version)"
          echo "iphoneos SDK: ${SDK_VERSION}"
          if (( ${SDK_VERSION%%.*} < 18 )); then
            echo "::error::iOS 18 SDK or newer is required; found ${SDK_VERSION}"
            exit 1
          fi

      - name: Build unsigned IPA
        shell: bash
        run: bash build_ios_unsigned.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: MeloX-iOS-unsigned-${{ github.run_number }}
          path: |
            build/MeloX-iOS-unsigned.ipa
            build/ReleaseNotes.json
            build/ReleaseNotes.md
          if-no-files-found: error
          retention-days: 30
